<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrimark</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ==================== 启动页 ==================== -->
<div id="splash">
    <div class="splash-content">
        <h1>Wrimark</h1>
        <p>Qcwwn Studio   v2.0.0</p>
    </div>
</div>

<!-- ==================== 主页面 ==================== -->
<div id="home" style="display:none;">
    <button id="homeSettingsBtn" class="home-settings-btn">
        <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="settings-btn-text">设置</span>
    </button>
    <div class="home-header" id="homeClickable">
        <h1 id="homeTitle">Wrimark</h1>
        <span id="homeVersion">v2.0.0</span>
    </div>
    <p class="home-subtitle">轻量级的Markdown文本编辑工具</p>
    <div class="home-buttons">
        <button class="home-btn" id="btnNewFile">
            <svg class="home-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            <span class="home-btn-label">新建文件</span>
        </button>
        <button class="home-btn" id="btnOpenFile">
            <svg class="home-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span class="home-btn-label">打开文件</span>
        </button>
    </div>
</div>

<!-- ==================== 编辑器界面 ==================== -->
<div id="editor" style="display:none;">
    <!-- 快速访问栏 -->
    <div class="quick-bar" id="quickBar">
        <div class="quick-bar-left">
            <button class="qb-btn qb-btn-accent" id="btnOutline" title="大纲视图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg></button>
            <span class="qb-sep"></span>
            <button class="qb-btn" id="btnUndo" disabled title="撤销 (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
            <button class="qb-btn" id="btnRedo" disabled title="重做 (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
            <span class="qb-sep"></span>
            <button class="qb-btn" id="btnSave" title="保存 (Ctrl+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
            <button class="qb-btn" id="btnSaveAs" title="另存为 (Ctrl+Shift+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/><line x1="10" y1="4" x2="14" y2="4"/></svg></button>
            <span class="qb-sep"></span>
            <button class="qb-btn" id="btnSearch" title="搜索与替换 (Ctrl+F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        </div>
        <div class="quick-bar-right">
            <label class="qb-autosave" title="自动保存 (每60秒)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span class="qb-autosave-text">自动保存</span>
                <div class="toggle-switch">
                    <input type="checkbox" id="autoSaveCheck">
                    <span class="toggle-slider"></span>
                </div>
            </label>
            <button class="qb-btn qb-btn-accent qb-fs-btn" id="btnEditorFullscreen" title="全屏编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><span class="qb-btn-label">全屏编辑</span></button>
            <button class="qb-btn qb-btn-accent qb-fs-btn" id="btnPreviewFullscreen" title="全屏预览"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><span class="qb-btn-label">全屏预览</span></button>
            <button class="qb-btn" id="editorSettingsBtn" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        </div>
    </div>

    <!-- Ribbon 功能区 -->
    <div class="ribbon" id="ribbon">
        <div class="ribbon-tabs">
            <button class="ribbon-tab" data-tab="file">文件</button>
            <button class="ribbon-tab active" data-tab="home">开始</button>
            <button class="ribbon-tab" data-tab="view">视图</button>
            <button class="ribbon-tab" data-tab="syntax">语法</button>
            <button class="ribbon-collapse-btn" id="ribbonCollapseBtn" title="折叠功能区">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
            </button>
        </div>
        <div class="ribbon-panels" id="ribbonPanels">
            <!-- 文件面板 -->
            <div class="ribbon-panel" data-panel="file">
                <div class="ribbon-group">
                    <button class="rb-btn rb-btn-lg" data-action="new" title="新建文件 (Ctrl+N)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg><span class="rb-btn-label">新建</span></button>
                    <button class="rb-btn rb-btn-lg" data-action="open" title="打开文件 (Ctrl+O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span class="rb-btn-label">打开</span></button>
                    <button class="rb-btn rb-btn-lg" data-action="save" title="保存 (Ctrl+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg><span class="rb-btn-label">保存</span></button>
                    <button class="rb-btn rb-btn-lg" data-action="saveas" title="另存为"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/><line x1="10" y1="4" x2="14" y2="4"/></svg><span class="rb-btn-label">另存为</span></button>
                    <button class="rb-btn rb-btn-lg" data-action="exporthtml" title="导出 HTML"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span class="rb-btn-label">导出HTML</span></button>
                </div>
            </div>
            <!-- 开始面板 -->
            <div class="ribbon-panel active" data-panel="home">
                <div class="ribbon-group">
                    <button class="rb-btn" data-fmt="bold" title="加粗 (Ctrl+B)"><b>B</b></button>
                    <button class="rb-btn" data-fmt="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
                    <button class="rb-btn" data-fmt="strikethrough" title="删除线"><s>S</s></button>
                </div>
                <span class="rb-sep"></span>
                <div class="ribbon-group">
                    <select class="rb-select" id="headingSelect" title="标题级别">
                        <option value="">正文</option>
                        <option value="h1">标题 1</option>
                        <option value="h2">标题 2</option>
                        <option value="h3">标题 3</option>
                        <option value="h4">标题 4</option>
                        <option value="h5">标题 5</option>
                        <option value="h6">标题 6</option>
                    </select>
                </div>
                <span class="rb-sep"></span>
                <div class="ribbon-group">
                    <button class="rb-btn" data-fmt="link" title="插入链接 (Ctrl+K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
                    <button class="rb-btn" data-fmt="image" title="插入图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
                    <button class="rb-btn" data-fmt="code" title="行内代码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
                    <button class="rb-btn" data-fmt="quote" title="引用块"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg></button>
                </div>
                <span class="rb-sep"></span>
                <div class="ribbon-group">
                    <button class="rb-btn" data-fmt="divider" title="分割线"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="12" x2="20" y2="12"/></svg></button>
                    <button class="rb-btn" data-fmt="highlight" title="高亮文本"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
                </div>
                <span class="rb-sep"></span>
                <div class="ribbon-group">
                    <button class="rb-btn" data-fmt="ul" title="无序列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
                    <button class="rb-btn" data-fmt="ol" title="有序列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg></button>
                    <button class="rb-btn" data-fmt="task" title="任务列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></button>
                </div>
                <span class="rb-sep"></span>
                <div class="ribbon-group">
                    <button class="rb-btn" data-fmt="codeblock" title="代码块"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
                    <button class="rb-btn" data-fmt="table" title="插入表格"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg></button>
                </div>
            </div>
            <!-- 视图面板 -->
            <div class="ribbon-panel" data-panel="view">
                <div class="ribbon-group">
                    <button class="rb-btn rb-btn-lg" id="btnOutlineRibbon" data-action="outline" title="切换大纲视图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><span class="rb-btn-label">大纲</span></button>
                </div>
                <span class="rb-sep"></span>
                <div class="ribbon-group">
                    <div class="rb-label-group">
                        <label class="rb-label">外观</label>
                        <select class="rb-select" id="viewThemeSelect">
                            <option value="light">浅色</option>
                            <option value="dark">深色</option>
                        </select>
                    </div>
                </div>
                <span class="rb-sep"></span>
                <div class="ribbon-group">
                    <div class="rb-label-group">
                        <label class="rb-label">预览风格</label>
                        <select class="rb-select" id="previewStyleSelect">
                            <option value="default">默认</option>
                            <option value="github">GitHub</option>
                            <option value="vuepress">VuePress</option>
                        </select>
                    </div>
                </div>
            </div>
            <!-- 语法面板 -->
            <div class="ribbon-panel" data-panel="syntax">
                <div class="ribbon-group">
                    <button class="rb-btn rb-btn-lg" id="btnSyntaxDocs" title="阅读 Markdown 语法文档">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                        <span class="rb-btn-label">阅读 Markdown 语法文档</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 主体区域 -->
    <div class="main-area" id="mainArea">
        <!-- 大纲侧边栏 -->
        <div class="outline-sidebar" id="outlineSidebar" style="display:none;">
            <div class="outline-header">
                <span>大纲</span>
                <button class="outline-close-btn" id="outlineCloseBtn">&times;</button>
            </div>
            <div class="outline-content" id="outlineContent">
                <p class="outline-empty">暂无标题</p>
            </div>
        </div>

        <!-- 编辑器面板（左） -->
        <div id="editorPanel" class="panel">
            <div class="editor-container" id="editorContainer">
                <div class="line-numbers" id="lineNumbers"><div class="line-numbers-inner">1</div></div>
                <textarea id="editorTextarea" placeholder="在此编辑 Markdown 内容..." spellcheck="false"></textarea>
            </div>
            <!-- 浮动字数统计药丸 -->
            <div class="word-count-pill" id="wordCountPill">
                <span id="pillContent">0 字 | 0 字符 | 0 行</span>
            </div>
        </div>

        <!-- 分隔线 -->
        <div class="divider" id="divider"></div>

        <!-- 预览面板（右） -->
        <div id="previewPanel" class="panel">
            <div id="previewContent" class="preview-content markdown-body"></div>
        </div>
    </div>

    <!-- 查找和替换弹窗 -->
    <div id="findReplaceDialog" class="fr-overlay" style="display:none;">
        <div class="find-replace-box" id="frBox">
            <div class="fr-header fr-drag-handle" id="frDragHandle">
                <span>搜索和替换</span>
                <button class="fr-close-btn" id="frCloseBtn">&times;</button>
            </div>
            <div class="fr-row fr-find-row">
                <input type="text" id="frFindInput" placeholder="查找...">
                <button class="fr-btn fr-btn-primary fr-search-btn" id="frSearchBtn">搜索</button>
                <span class="fr-count" id="frCount"></span>
            </div>
            <div class="fr-row">
                <input type="text" id="frReplaceInput" placeholder="替换为...">
            </div>
            <div class="fr-options">
                <label class="fr-option"><input type="checkbox" id="frCaseSensitive"> 区分大小写</label>
                <label class="fr-option"><input type="checkbox" id="frWholeWord"> 全词匹配</label>
                <label class="fr-option"><input type="checkbox" id="frRegex"> 正则表达式</label>
            </div>
            <div class="fr-buttons">
                <button class="fr-btn fr-btn-secondary" id="frFindNext">查找下一个</button>
                <button class="fr-btn fr-btn-primary" id="frReplace">替换</button>
                <button class="fr-btn fr-btn-primary" id="frReplaceAll">全部替换</button>
            </div>
        </div>
    </div>
</div>

<!-- ==================== 设置弹窗 ==================== -->
<div id="settingsModal" class="modal-overlay" style="display:none;">
    <div class="settings-box">
        <h2 class="settings-title">Wrimark  <span class="settings-version">v2.0.0</span></h2>
        <p class="settings-desc">一个轻量级的 Markdown 文本编辑器</p>
        <div class="settings-info">
            <p><strong>开发者</strong>：Qcwwn Studio</p>
            <p><strong>版本号</strong>：v2.0.0 <a class="check-update-link" id="checkUpdateLink">检查更新</a></p>
            <p><strong>主页</strong>：<a class="settings-link external-link" data-href="https://studio.qcwwn.cn/wrimark">studio.qcwwn.cn/wrimark</a></p>
            <div class="settings-row">
                <label for="themeSelect"><strong>外观</strong>：</label>
                <select id="themeSelect" class="settings-select">
                    <option value="light">浅色</option>
                    <option value="dark">深色</option>
                </select>
            </div>
        </div>
        <div class="settings-buttons">
            <button class="settings-btn settings-btn-primary external-link" data-href="https://studio.qcwwn.cn/wrimark">访问主页</button>
            <button class="settings-btn settings-btn-primary external-link" data-href="https://docs.qcwwn.cn/wrimark">帮助文档</button>
            <button class="settings-btn settings-btn-secondary" id="settingsCloseBtn">关闭</button>
        </div>
    </div>
</div>

<!-- ==================== 未保存确认弹窗 ==================== -->
<div id="unsavedModal" class="modal-overlay" style="display:none;">
    <div class="unsaved-box">
        <p class="unsaved-text">文件尚未保存，是否保存更改？</p>
        <div class="unsaved-buttons">
            <button class="settings-btn settings-btn-primary" id="unsavedSaveBtn">保存</button>
